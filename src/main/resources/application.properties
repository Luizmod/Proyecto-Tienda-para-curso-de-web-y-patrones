spring.application.name=tienda
#puerto donde escucha nuestro servidor web
server.port = 80

#Para definir el formato de salida del log en horas y minutos
logging.pattern.dateformat=hh:mm

#Evitamos la salida del banner de spring
spring.main.banner-mode=off

#Definimos el cache como false en desarrollo, en produccion va a ser true
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop
#Conexión NUBE AIVEN la BD Techshop en MySQL
#spring.datasource.url=jdbc:mysql://techshop-techshop-40143.i.aivencloud.com:24342/techshop

#Usuario y clave de creaTablas.sql
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=techshop-b0ec1.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-b0ec1-firebase-adminsdk-fbsvc-d6e2e21cdd.json
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
